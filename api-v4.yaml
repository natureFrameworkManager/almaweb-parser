openapi: 3.1.0
info:
  title: AlmaWeb API
  version: 4.0.0-proposal
  summary: Data-model-aligned API with full filter, export, and admin support
  description: |
    ## Overview

    Version 4 aligns endpoint design directly with the canonical data models
    (Modules, Courses, Events, Staff, Locations, Buildings, Degrees, Faculties,
    Semesters, Event types, Status) and adds the features described in the
    openapi.md outline:

    - **Uniform filter model** — every collection supports the same set of
      cross-cutting filters (id, name, number, type, relationships, date ranges,
      boolean presence flags).
    - **Pagination, sorting, field selection** on every collection endpoint.
    - **Distinct field endpoints** (`/distinct/{field}`) on every collection.
    - **Changes endpoint** per resource and globally under `/admin/changes`.
    - **Export** via query-parameter (`?format=ical|csv|json`) or `Accept` header
      on every collection *and* single-item endpoint.
    - **Related-entity sub-endpoints** (`/{resource}/{id}/{child}`).
    - **Weekly schedule view** (`/weekly`).
    - **Admin endpoints** — health, stats, changes, sync.
    - **RFC 9457 Problem Details** for all error responses.

  contact:
    name: AlmaWeb Parser Maintainers
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Modules
    description: University modules (Lehrveranstaltungen).
  - name: Courses
    description: Schedulable course units within modules.
  - name: Events
    description: Concrete timetable occurrences of courses.
  - name: Staff
    description: Teaching staff.
  - name: Locations
    description: Rooms and lecture halls.
  - name: Buildings
    description: Physical buildings that contain locations.
  - name: Degrees
    description: Degree programs.
  - name: Faculties
    description: Faculties / departments.
  - name: Semesters
    description: Academic semesters.
  - name: Catalog
    description: Reference data — event types, status values.
  - name: Schedule
    description: Weekly timetable view.
  - name: Exports
    description: Bulk data exports.
  - name: Admin
    description: Ingestion / sync, health, stats, changes.

# ===========================================================================
# PATHS
# ===========================================================================
paths:

  # =========================================================================
  # MODULES
  # =========================================================================
  /api/v4/modules:
    get:
      tags: [Modules]
      summary: List modules
      operationId: listModules
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Q'
        - name: name
          in: query
          description: Partial case-insensitive match on module name. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: number
          in: query
          description: Partial match on module number. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: language
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: frequency
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: credits_min
          in: query
          schema: { type: number }
        - name: credits_max
          in: query
          schema: { type: number }
        - name: duration_semesters_min
          in: query
          schema: { type: integer, minimum: 1 }
        - name: duration_semesters_max
          in: query
          schema: { type: integer, minimum: 1 }
        - name: degree_id
          in: query
          description: Filter by degree program. Repeatable OR.
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: faculty_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: semester_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: staff_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: has_courses
          in: query
          schema: { type: boolean }
        - name: has_events
          in: query
          schema: { type: boolean }
        - name: has_staff
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/UpdatedUntil'
        - $ref: '#/components/parameters/ModuleInclude'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/ModuleSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Paginated module list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
            text/csv:
              schema: { type: string }
            text/calendar:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v4/modules/distinct/{field}:
    get:
      tags: [Modules]
      summary: Distinct values for a module field
      operationId: getModuleDistinctField
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum: [name, number, language, frequency, credits, duration_semesters, degree_id, faculty_id, semester_id]
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/IncludeCounts'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Distinct field values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistinctValuesResponse'

  /api/v4/modules/changes:
    get:
      tags: [Modules]
      summary: Module changes in a timestamp range
      operationId: getModuleChanges
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/IncludeDeleted'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Changed modules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'

  /api/v4/modules/{module_id}:
    get:
      tags: [Modules]
      summary: Get module by ID
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ModuleInclude'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Module details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetail'
            text/csv:
              schema: { type: string }
            text/calendar:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v4/modules/{module_id}/courses:
    get:
      tags: [Modules]
      summary: Courses for a module
      operationId: listCoursesForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/CourseInclude'
        - $ref: '#/components/parameters/CourseSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Courses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
            text/csv:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v4/modules/{module_id}/events:
    get:
      tags: [Modules]
      summary: Events for a module (flattened across all courses)
      operationId: listEventsForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
            text/calendar:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v4/modules/{module_id}/staff:
    get:
      tags: [Modules]
      summary: Staff for a module
      operationId: listStaffForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Staff members.
