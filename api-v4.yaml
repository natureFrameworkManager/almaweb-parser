  # =========================================================================
  # WEEKLY SCHEDULE
  # =========================================================================
  /api/v4/weekly:
    get:
      tags: [Schedule]
      summary: Generic weekly timetable (Monday–Sunday)
      description: |
        Combines all matching events into a generic weekly schedule grouped by
        weekday and aggregated into time slots. Recurring weekly slots are
        deduplicated — a slot represents a recurring pattern, not individual dates.
      operationId: getWeeklySchedule
      parameters:
        - name: semester_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: faculty_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: degree_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: module_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: staff_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: location_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: weekday
          in: query
          description: "0=Monday … 6=Sunday. Repeatable OR."
          schema:
            type: array
            items: { type: integer, minimum: 0, maximum: 6 }
          style: form
          explode: true
        - name: slot_size_minutes
          in: query
          description: Duration of each time slot grid cell in minutes.
          schema: { type: integer, minimum: 15, maximum: 120, default: 60 }
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: Weekly schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyScheduleResponse'
            text/calendar:
              schema: { type: string, format: binary }

