            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: event_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: staff_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: faculty_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: semester_id
