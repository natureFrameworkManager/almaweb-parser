  /api/v4/admin/sync:
    get:
      tags: [Admin]
      summary: List ingestion runs
      operationId: listSyncRuns
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [queued, running, succeeded, failed, canceled]
          style: form
          explode: true
        - name: started_after
          in: query
          schema: { type: string, format: date-time }
        - name: started_before
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Ingestion run list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunListResponse'

    post:
      tags: [Admin]
      summary: Trigger a new ingestion run
      operationId: triggerSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRunRequest'
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v4/admin/sync/{run_id}:
    get:
      tags: [Admin]
      summary: Get ingestion run details
      operationId: getSyncRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v4/admin/sync/{run_id}/cancel:
    post:
      tags: [Admin]
      summary: Cancel a running or queued ingestion run
      operationId: cancelSyncRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Run cannot be cancelled in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

# ===========================================================================
# COMPONENTS
# ===========================================================================
components:
  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------
  parameters:
    Id:
      name: id
      in: query
      description: Filter by database ID(s). Repeatable OR.
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    Q:
      name: q
      in: query
      description: Free-text search across primary text fields.
      schema: { type: string }
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IncludeCounts:
      name: include_counts
      in: query
      schema: { type: boolean, default: true }
    Format:
      name: format
      in: query
      description: Response format. Overrides the Accept header.
      schema:
        type: string
        enum: [json, csv, ical]
        default: json
    UpdatedSince:
      name: updated_since
      in: query
      description: Include only entities updated on or after this timestamp.
      schema: { type: string, format: date-time }
    UpdatedUntil:
      name: updated_until
      in: query
      description: Include only entities updated on or before this timestamp.
      schema: { type: string, format: date-time }
    Since:
      name: since
      in: query
      required: true
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      schema: { type: string, format: date-time }
    IncludeDeleted:
      name: include_deleted
      in: query
      description: Include deleted/tombstone entries in the result.
      schema: { type: boolean, default: false }

    # Path parameters
    ModuleId:
      name: module_id
      in: path
      required: true
      schema: { type: integer }
    CourseId:
      name: course_id
      in: path
      required: true
      schema: { type: integer }
    EventId:
      name: event_id
      in: path
      required: true
      schema: { type: integer }
    StaffId:
      name: staff_id
      in: path
      required: true
      schema: { type: integer }
    LocationId:
      name: location_id
      in: path
      required: true
      schema: { type: integer }
    BuildingId:
      name: building_id
      in: path
      required: true
      schema: { type: integer }

    # Common query helpers
    Fields:
      name: fields
      in: query
      description: Sparse fieldset — comma-separated list of field names to include.
      schema: { type: string }

    ExportEntity:
      name: entity
      in: query
      description: Target entity type to export.
      schema:
        type: string
        enum: [modules, courses, events, staff, locations, buildings, degrees, faculties, semesters]
        default: events

    ExportName:
      name: name
      in: query
      description: Partial case-insensitive match on entity name/title. Repeatable OR.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    ExportNumber:
      name: number
      in: query
      description: Partial case-insensitive match on datasource number. Repeatable OR.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    ExportType:
      name: type
      in: query
      description: Type filter (for entities that expose a type). Repeatable OR.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    ExportBuilding:
      name: building
      in: query
      description: Partial case-insensitive building name filter. Repeatable OR.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
    ExportDepartment:
      name: department
      in: query
      description: Partial case-insensitive department filter. Repeatable OR.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true

    ExportModuleId:
      name: module_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    ExportCourseId:
      name: course_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    ExportEventId:
      name: event_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    ExportStaffId:
      name: staff_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    ExportLocationId:
      name: location_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    ExportDegreeId:
      name: degree_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    ExportFacultyId:
      name: faculty_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true
    ExportSemesterId:
      name: semester_id
      in: query
      schema:
        type: array
        items: { type: integer }
      style: form
      explode: true

    ExportWeekdayStart:
      name: weekday_start
      in: query
      description: Inclusive lower bound for weekday range (0=Monday ... 6=Sunday).
      schema: { type: integer, minimum: 0, maximum: 6 }
    ExportWeekdayEnd:
      name: weekday_end
      in: query
      description: Inclusive upper bound for weekday range (0=Monday ... 6=Sunday).
      schema: { type: integer, minimum: 0, maximum: 6 }
    ExportStartTimeFrom:
      name: start_time_from
      in: query
      schema: { type: string, format: time }
    ExportStartTimeTo:
      name: start_time_to
      in: query
      schema: { type: string, format: time }
    ExportEndTimeFrom:
      name: end_time_from
      in: query
      schema: { type: string, format: time }
    ExportEndTimeTo:
      name: end_time_to
      in: query
      schema: { type: string, format: time }
    ExportCreditsMin:
      name: credits_min
      in: query
      schema: { type: number }
    ExportCreditsMax:
      name: credits_max
      in: query
      schema: { type: number }
    ExportYearStart:
      name: year_start
      in: query
      description: Inclusive lower bound for semester year range.
      schema: { type: integer }
    ExportYearEnd:
      name: year_end
      in: query
      description: Inclusive upper bound for semester year range.
      schema: { type: integer }

    ExportHasCourses:
      name: has_courses
      in: query
      schema: { type: boolean }
    ExportHasEvents:
      name: has_events
      in: query
      schema: { type: boolean }
    ExportHasStaff:
      name: has_staff
      in: query
      schema: { type: boolean }

    ExportSortBy:
      name: sort_by
      in: query
      description: Field used for sorting export rows.
      schema: { type: string }
    ExportSortOrder:
      name: sort_order
      in: query
      description: Sort order direction.
      schema:
        type: string
        enum: [asc, desc]
        default: asc

    IcalTitleFormat:
      name: title_format
      in: query
      description: Template used for iCal SUMMARY values.
      schema: { type: string }
    IcalLocationFormat:
      name: location_format
      in: query
      description: Template used for iCal LOCATION values.
      schema: { type: string }
    IcalDescriptionFormat:
      name: description_format
      in: query
      description: Template used for iCal DESCRIPTION values.
      schema: { type: string }
    IcalIncludeCourseInfo:
      name: include_course_info
      in: query
      schema: { type: boolean, default: true }
    IcalIncludeEventInfo:
      name: include_event_info
      in: query
      schema: { type: boolean, default: true }
    IcalIncludeStaffInfo:
      name: include_staff_info
      in: query
      schema: { type: boolean, default: true }
    IcalIncludeRelationshipInfo:
      name: include_relationship_info
      in: query
      schema: { type: boolean, default: true }

    EventDateFrom:
      name: date_from
      in: query
      description: Include events on or after this date.
      schema: { type: string, format: date }
    EventDateTo:
      name: date_to
      in: query
      description: Include events on or before this date.
      schema: { type: string, format: date }
    EventWeekday:
      name: weekday
      in: query
      description: "0=Monday … 6=Sunday. Repeatable OR."
      schema:
        type: array
        items: { type: integer, minimum: 0, maximum: 6 }
      style: form
      explode: true

    # Include (embed) parameters
    ModuleInclude:
      name: include
      in: query
      description: Related resources to embed.
      schema:
        type: array
        items:
          type: string
          enum: [courses, events, staff, degrees]
      style: form
      explode: false
    CourseInclude:
      name: include
      in: query
      description: Related resources to embed.
      schema:
        type: array
        items:
          type: string
          enum: [module, events, staff]
      style: form
      explode: false
    EventInclude:
      name: include
      in: query
      description: Related resources to embed.
      schema:
        type: array
        items:
          type: string
          enum: [course, module, staff, location]
      style: form
      explode: false

    # Sort parameters
    ModuleSort:
      name: sort
      in: query
      description: "Prefix `-` for descending."
      schema:
        type: string
        enum: [name, -name, number, -number, credits, -credits, duration_semesters, -duration_semesters]
    CourseSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, -name, number, -number, type, -type, weekly_hours, -weekly_hours]
    EventSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [date, -date, start_time, -start_time, end_time, -end_time, weekday, -weekday]
    StaffSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, -name]
    LocationSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, -name, seats, -seats, size, -size]

  # -------------------------------------------------------------------------
  # Responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # -- RFC 9457 Problem Details ------------------------------------------
    Problem:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    # -- Pagination --------------------------------------------------------
    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total_items: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    # -- Distinct values ---------------------------------------------------
    DistinctValue:
      type: object
      required: [value]
      properties:
        value:
          oneOf:
            - type: string
            - type: number
            - type: integer
        count:
          type: integer
          minimum: 0

    DistinctValuesResponse:
      type: object
      required: [field, items]
      properties:
        field: { type: string }
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DistinctValue'

    # -- Changes -----------------------------------------------------------
    ChangeItem:
      type: object
      required: [resource_type, resource_id, action, changed_at]
      properties:
        resource_type:
          type: string
          enum: [module, course, event, staff, location, building, degree, faculty, semester]
        resource_id: { type: integer }
        action:
          type: string
          enum: [created, updated, deleted]
        changed_at:
          type: string
          format: date-time
        item:
          description: Full resource snapshot (null for deleted items).
          nullable: true
          type: object

    ChangesResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeItem'

    # -- Catalog schemas ---------------------------------------------------
    Semester:
      type: object
      required: [id, name, year, term]
      properties:
        id: { type: integer }
        name: { type: string }
        year: { type: integer }
        term: { type: string }

    SemesterListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Semester'

    Faculty:
      type: object
      required: [id, name, prefix]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: integer }

    FacultyListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Faculty'

    Degree:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        faculty_id:
          type: integer
          nullable: true
        faculty:
          nullable: true
          $ref: '#/components/schemas/Faculty'

    DegreeListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Degree'

    EventType:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    EventTypeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventType'

    Status:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    StatusListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Status'

    # -- Building / Location schemas ---------------------------------------
    BuildingSummary:
      type: object
      required: [id, name, short]
      properties:
        id: { type: integer }
        name: { type: string }
        short: { type: string }
        address:
          type: string
          nullable: true

    Building:
      allOf:
        - $ref: '#/components/schemas/BuildingSummary'
        - type: object
          properties:
            location_count:
              type: integer
              minimum: 0

    BuildingListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuildingSummary'

    LocationSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        external_id:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        seats:
          type: integer
          nullable: true
          minimum: 0
        size:
          type: number
          nullable: true
          minimum: 0
        accessibility:
          type: boolean
          nullable: true
        building_id:
          type: integer
          nullable: true

    LocationDetail:
      allOf:
        - $ref: '#/components/schemas/LocationSummary'
        - type: object
          properties:
            description:
              type: string
              nullable: true
            building:
              nullable: true
              $ref: '#/components/schemas/BuildingSummary'

    LocationListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummary'

    # -- Staff schemas -----------------------------------------------------
    StaffSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    StaffDetail:
      allOf:
        - $ref: '#/components/schemas/StaffSummary'
        - type: object
          properties:
            course_count: { type: integer, minimum: 0 }
            event_count: { type: integer, minimum: 0 }
            courses:
              type: array
              items:
                $ref: '#/components/schemas/CourseSummary'
            modules:
              type: array
              items:
                $ref: '#/components/schemas/ModuleSummary'

    StaffListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffSummary'

    # -- Module schemas ----------------------------------------------------
    ModuleSummary:
      type: object
      required: [id, name, number]
      properties:
        id: { type: integer }
        name: { type: string }
        number: { type: string }
        language:
          type: string
          nullable: true
        duration_semesters:
          type: integer
          nullable: true
          minimum: 1
        credits:
          type: integer
          nullable: true
          minimum: 0
        frequency:
          type: string
          nullable: true
        last_updated:
          type: string
          format: date-time
          nullable: true

    ModuleDetail:
      allOf:
        - $ref: '#/components/schemas/ModuleSummary'
        - type: object
          properties:
            goals:
              type: string
              nullable: true
            content:
              type: string
              nullable: true
            exam_prerequisites:
              type: string
              nullable: true
            prerequisites:
              type: string
              nullable: true
            responsible_staff:
              type: array
              items:
                $ref: '#/components/schemas/StaffSummary'
            start_semesters:
              type: array
              items:
                $ref: '#/components/schemas/Semester'
            courses:
              type: array
              items:
                $ref: '#/components/schemas/CourseSummary'
            degrees:
              description: Degrees and the semester number in which this module appears.
              type: array
              items:
                $ref: '#/components/schemas/ModuleDegreeLink'

    ModuleDegreeLink:
      type: object
      required: [degree_id]
      properties:
        degree_id: { type: integer }
        degree:
          $ref: '#/components/schemas/Degree'
        semester_number:
          type: integer
          nullable: true
          minimum: 1
          description: The study-plan semester number in the degree program.

    ModuleListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModuleSummary'

    # -- Course schemas ----------------------------------------------------
    CourseSummary:
      type: object
      required: [id, name, number]
      properties:
        id: { type: integer }
        name: { type: string }
        number: { type: string }
        type:
          type: string
          nullable: true
        weekly_hours:
          type: integer
          nullable: true
          minimum: 0
        language:
          type: string
          nullable: true
        status_id:
          type: integer
          nullable: true
        module_id:
          type: integer
          nullable: true
        last_updated:
          type: string
          format: date-time
          nullable: true

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          properties:
            status:
              nullable: true
              $ref: '#/components/schemas/Status'
            module:
              nullable: true
              $ref: '#/components/schemas/ModuleSummary'
            staff:
              type: array
              items:
                $ref: '#/components/schemas/StaffSummary'
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'

    CourseListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'

    # -- Event schemas -----------------------------------------------------
    EventSummary:
      type: object
      required: [id, number, name]
      properties:
        id: { type: integer }
        number: { type: string }
        name: { type: string }
        type_id:
          type: integer
          nullable: true
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
        weekday:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: "0=Monday … 6=Sunday. Null for one-off/dated events."
        date:
          type: string
          format: date
          nullable: true
          description: Specific calendar date (for non-recurring events).
        location_id:
          type: integer
          nullable: true
        last_updated:
          type: string
          format: date-time
          nullable: true

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            type:
              nullable: true
              $ref: '#/components/schemas/EventType'
            location:
              nullable: true
              $ref: '#/components/schemas/LocationSummary'
            staff:
              type: array
              items:
                $ref: '#/components/schemas/StaffSummary'
            course_id:
              type: integer
              nullable: true
            course:
              nullable: true
              $ref: '#/components/schemas/CourseSummary'

    EventListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'

    ExportJsonResponse:
      type: object
      required: [meta, entity, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        entity:
          type: string
          enum: [modules, courses, events, staff, locations, buildings, degrees, faculties, semesters]
        items:
          type: array
          items:
            type: object

    # -- Weekly schedule ---------------------------------------------------
    WeeklyTimeSlot:
      type: object
      required: [weekday, start_time, end_time, events]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: "0=Monday … 6=Sunday."
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'

    WeeklyScheduleResponse:
      type: object
      required: [slot_size_minutes, days]
      properties:
        slot_size_minutes: { type: integer }
        days:
          description: Ordered Mon–Sun, only includes days with events.
          type: array
          items:
            type: object
            required: [weekday, label, slots]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6 }
              label: { type: string }
              slots:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyTimeSlot'

    # -- Admin / Sync ------------------------------------------------------
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version: { type: string }
        database:
          type: string
          enum: [ok, degraded, down]

    StatsResponse:
      type: object
      required: [modules, courses, events, staff, locations, buildings, degrees, faculties, semesters]
      properties:
        modules: { type: integer, minimum: 0 }
        courses: { type: integer, minimum: 0 }
        events: { type: integer, minimum: 0 }
        staff: { type: integer, minimum: 0 }
        locations: { type: integer, minimum: 0 }
        buildings: { type: integer, minimum: 0 }
        degrees: { type: integer, minimum: 0 }
        faculties: { type: integer, minimum: 0 }
        semesters: { type: integer, minimum: 0 }
        last_sync:
          type: string
          format: date-time
          nullable: true

    SyncRunRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [full, incremental, partial]
          description: |
            - full: Re-ingest all data from scratch.
            - incremental: Only ingest new or updated data since the last successful run.
            - partial: Only ingest the specified entity types.
        entities:
          description: For `partial` mode — restrict to these entity types.
          type: array
          items:
            type: string
            enum: [modules, courses, events, staff, locations]
        source:
          description: Which upstream endpoint to use.
          type: string
          enum: [timetable_informatics, vorlesungsverzeichnis]
          default: vorlesungsverzeichnis
        since:
          description: For `incremental` mode — override the auto-detected watermark.
          type: string
          format: date-time

    SyncRun:
      type: object
      required: [id, mode, status, created_at]
      properties:
        id: { type: string }
        mode:
          type: string
          enum: [full, incremental, partial]
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        source:
          type: string
          nullable: true
        entities:
          type: array
          nullable: true
          items: { type: string }
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        records_upserted: { type: integer, minimum: 0 }
        records_deleted: { type: integer, minimum: 0 }
        error_message:
          type: string
          nullable: true

    SyncRunListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncRun'
