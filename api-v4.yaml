            items: { type: integer }
          style: form
          explode: true
        - name: building
          in: query
          description: Partial match on building name. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: staff_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: module_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: faculty_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: semester_id
          in: query
