        - name: name
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: number
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: type
          in: query
          description: Course type. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: language
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: status_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: weekly_hours_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: weekly_hours_max
          in: query
          schema: { type: integer, minimum: 0 }
        - name: module_id
          in: query
