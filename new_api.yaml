openapi: 3.1.0
info:
  title: AlmaWeb API
  version: 2.0.0-proposal
  summary: Proposed resource-oriented API structure for AlmaWeb data
  description: |
    Proposed next-generation API structure for AlmaWeb data.

    Design goals:
    - Keep canonical collection and item endpoints for modules, courses, events, and rooms.
    - Reduce query-string sprawl by moving advanced filtering into dedicated query sub-endpoints.
    - Prefer relation endpoints over duplicating parent filter parameters on every resource.
    - Add facet endpoints so clients can build filter UIs without hardcoding available values.
    - Add schedule and export endpoints for common planner and calendar use cases.

    Notes:
    - This file is a proposal, not a guarantee that all endpoints are implemented today.
    - The room endpoints assume normalized room parsing is added to the crawler.
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Modules
  - name: Courses
  - name: Events
  - name: Rooms
  - name: Schedule
  - name: Catalog
  - name: Ingestion
  - name: Exports
  - name: Search
paths:
  /api/v2/modules:
    get:
      tags: [Modules]
      summary: List modules
      description: |
        Returns modules with lightweight filtering for common use cases.

        Use `/api/v2/modules/query` for complex boolean filters, large filter payloads,
        saved searches, or clients that should avoid long query strings.
      operationId: listModules
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/DegreeProgram'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/UpdatedUntil'
        - name: name
          in: query
          description: Case-insensitive partial match on module name. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: module_number
          in: query
          description: Case-insensitive partial match on module number. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: responsible_person
          in: query
          description: Case-insensitive partial match on responsible person. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: start_semester
          in: query
          description: Repeatable OR filter on module start semester.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: frequency
          in: query
          description: Repeatable OR filter on module frequency.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: credits_gte
          in: query
          schema:
            type: number
        - name: credits_lte
          in: query
          schema:
            type: number
        - name: duration_semesters_gte
          in: query
          schema:
            type: integer
            minimum: 0
        - name: duration_semesters_lte
          in: query
          schema:
            type: integer
            minimum: 0
        - name: path_prefix
          in: query
          description: Exact prefix match on the normalized path string, joined by ` > `.
          schema:
            type: string
        - name: path_contains
          in: query
          description: Partial match on the normalized path string, joined by ` > `.
          schema:
            type: string
        - name: has_courses
          in: query
          description: Filter by whether the module has at least one course.
          schema:
            type: boolean
        - name: has_events
          in: query
          description: Filter by whether at least one event exists under any course of the module.
          schema:
            type: boolean
        - $ref: '#/components/parameters/ModuleInclude'
        - $ref: '#/components/parameters/ModuleFields'
        - $ref: '#/components/parameters/ModuleSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of modules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v2/modules/query:
    post:
      tags: [Modules]
      summary: Query modules with advanced filters
      description: |
        Advanced module search endpoint for clients that need nested boolean logic,
        reusable filter payloads, or large criteria sets.
      operationId: queryModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleQueryRequest'
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v2/modules/facets:
    get:
      tags: [Modules]
      summary: Get module facets
      description: |
        Returns facet buckets for filterable module fields.

        Clients can optionally pass the same lightweight filters used by `/api/v2/modules`
        to compute facets for the currently narrowed result set.
      operationId: getModuleFacets
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: path_prefix
          in: query
          schema:
            type: string
        - name: path_contains
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Module facet buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleFacetsResponse'

  /api/v2/modules/{moduleId}:
    get:
      tags: [Modules]
      summary: Get module by ID
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ModuleInclude'
        - $ref: '#/components/parameters/ModuleFields'
      responses:
        '200':
          description: Module details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/modules/{moduleId}/courses:
    get:
      tags: [Modules]
      summary: List courses for a module
      operationId: listCoursesForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: language
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: staff
          in: query
          description: Case-insensitive partial match on course staff. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: has_events
          in: query
          schema:
            type: boolean
        - name: weekly_hours_gte
          in: query
          schema:
            type: integer
            minimum: 0
        - name: weekly_hours_lte
          in: query
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/CourseInclude'
        - $ref: '#/components/parameters/CourseFields'
        - $ref: '#/components/parameters/CourseSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Courses belonging to the module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/modules/{moduleId}/events:
    get:
      tags: [Modules]
      summary: List events for a module
      operationId: listEventsForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/EventDate'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - $ref: '#/components/parameters/EventStartTimeGte'
        - $ref: '#/components/parameters/EventEndTimeLte'
        - $ref: '#/components/parameters/EventOverlapsTime'
        - name: location
          in: query
          schema:
            type: string
        - name: room
          in: query
          schema:
            type: string
        - name: building
          in: query
          schema:
            type: string
        - name: staff
          in: query
          description: Case-insensitive partial match on event staff. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - $ref: '#/components/parameters/EventInclude'
        - $ref: '#/components/parameters/EventFields'
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Events belonging to courses under the module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/modules/{moduleId}/calendar.ics:
    get:
      tags: [Modules, Exports]
      summary: Export a module schedule as iCalendar
      operationId: exportModuleCalendar
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventStartTimeGte'
        - $ref: '#/components/parameters/EventEndTimeLte'
      responses:
        '200':
          description: iCalendar file.
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/courses:
    get:
      tags: [Courses]
      summary: List courses
      description: |
        Returns courses with lightweight filters.

        Prefer relation endpoints such as `/api/v2/modules/{moduleId}/courses` when the client
        already knows the parent resource.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/DegreeProgram'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/UpdatedUntil'
        - name: name
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: number
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: language
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: staff
          in: query
          description: Case-insensitive partial match on course staff. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: staff_exact
          in: query
          description: Exact staff-member match in the parsed staff array. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: has_events
          in: query
          schema:
            type: boolean
        - name: weekly_hours_gte
          in: query
          schema:
            type: integer
            minimum: 0
        - name: weekly_hours_lte
          in: query
          schema:
            type: integer
            minimum: 0
        - name: module_id
          in: query
          description: Direct filter by owning module IDs. Repeatable OR filter.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: module_number
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: module_name
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: weekday
          in: query
          description: Filter courses that have at least one event on these weekdays.
          schema:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 6
          style: form
          explode: true
        - name: event_date_from
          in: query
          schema:
            type: string
            format: date
        - name: event_date_to
          in: query
          schema:
            type: string
            format: date
        - name: study_semester_gte
          in: query
          description: Minimum recommended study semester extracted from path metadata.
          schema:
            type: integer
            minimum: 1
        - name: study_semester_lte
          in: query
          description: Maximum recommended study semester extracted from path metadata.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/CourseInclude'
        - $ref: '#/components/parameters/CourseFields'
        - $ref: '#/components/parameters/CourseSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of courses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v2/courses/query:
    post:
      tags: [Courses]
      summary: Query courses with advanced filters
      operationId: queryCourses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseQueryRequest'
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v2/courses/facets:
    get:
      tags: [Courses]
      summary: Get course facets
      operationId: getCourseFacets
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: module_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Course facet buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseFacetsResponse'

  /api/v2/courses/{courseId}:
    get:
      tags: [Courses]
      summary: Get course by ID
      operationId: getCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/CourseInclude'
        - $ref: '#/components/parameters/CourseFields'
      responses:
        '200':
          description: Course details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/courses/{courseId}/module:
    get:
      tags: [Courses]
      summary: Get the parent module of a course
      operationId: getCourseModule
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Parent module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/courses/{courseId}/events:
    get:
      tags: [Courses]
      summary: List events for a course
      operationId: listEventsForCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/EventDate'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - $ref: '#/components/parameters/EventStartTimeGte'
        - $ref: '#/components/parameters/EventEndTimeLte'
        - $ref: '#/components/parameters/EventOverlapsTime'
        - name: location
          in: query
          schema:
            type: string
        - name: room
          in: query
          schema:
            type: string
        - name: building
          in: query
          schema:
            type: string
        - name: staff
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - $ref: '#/components/parameters/EventInclude'
        - $ref: '#/components/parameters/EventFields'
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Events belonging to the course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/courses/{courseId}/calendar.ics:
    get:
      tags: [Courses, Exports]
      summary: Export a course schedule as iCalendar
      operationId: exportCourseCalendar
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
      responses:
        '200':
          description: iCalendar file.
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/events:
    get:
      tags: [Events]
      summary: List events
      description: |
        Returns events with lightweight filters.

        Use relation endpoints when navigating from a known course or module,
        and use `/api/v2/events/query` for complex filter payloads.
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/DegreeProgram'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/UpdatedUntil'
        - $ref: '#/components/parameters/EventDate'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - $ref: '#/components/parameters/EventStartTimeGte'
        - $ref: '#/components/parameters/EventEndTimeLte'
        - $ref: '#/components/parameters/EventOverlapsTime'
        - name: location
          in: query
          description: Case-insensitive partial match on raw location text.
          schema:
            type: string
        - name: room
          in: query
          description: Exact or normalized room filter when structured room parsing is available.
          schema:
            type: string
        - name: building
          in: query
          description: Building identifier or building name when available.
          schema:
            type: string
        - name: staff
          in: query
          description: Case-insensitive partial match on event staff. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: staff_exact
          in: query
          description: Exact staff-member match in the parsed staff array. Repeatable OR filter.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: has_room
          in: query
          description: Filter events by whether normalized room information is available.
          schema:
            type: boolean
        - name: online_only
          in: query
          description: Include only online/remote events inferred from location metadata.
          schema:
            type: boolean
        - name: course_id
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: course_name
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: course_number
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: course_type
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: module_id
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: module_name
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: module_number
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: duration_minutes_gte
          in: query
          schema:
            type: integer
            minimum: 0
        - name: duration_minutes_lte
          in: query
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/EventInclude'
        - $ref: '#/components/parameters/EventFields'
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v2/events/query:
    post:
      tags: [Events]
      summary: Query events with advanced filters
      operationId: queryEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventQueryRequest'
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v2/events/facets:
    get:
      tags: [Events]
      summary: Get event facets
      operationId: getEventFacets
      parameters:
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - name: module_id
          in: query
          schema:
            type: integer
        - name: course_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Event facet buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFacetsResponse'

  /api/v2/events/{eventId}:
    get:
      tags: [Events]
      summary: Get event by ID
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/EventInclude'
        - $ref: '#/components/parameters/EventFields'
      responses:
        '200':
          description: Event details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/events/{eventId}/course:
    get:
      tags: [Events]
      summary: Get the parent course of an event
      operationId: getEventCourse
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Parent course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/events/{eventId}/module:
    get:
      tags: [Events]
      summary: Get the parent module of an event
      operationId: getEventModule
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Parent module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/rooms:
    get:
      tags: [Rooms]
      summary: List rooms
      description: |
        Proposed room endpoint once event locations are normalized into building and room entities.
      operationId: listRooms
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: building
          in: query
          schema:
            type: string
        - name: has_upcoming_events
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A paginated list of rooms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'

  /api/v2/rooms/{roomId}:
    get:
      tags: [Rooms]
      summary: Get room by ID
      operationId: getRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/rooms/{roomId}/events:
    get:
      tags: [Rooms]
      summary: List events for a room
      operationId: listEventsForRoom
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/EventDate'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - $ref: '#/components/parameters/EventOverlapsTime'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Events scheduled in the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/exports/ical:
    post:
      tags: [Exports]
      summary: Export matching events as iCalendar
      description: |
        Generates an iCalendar file for the events matching the supplied advanced event filter.
      operationId: exportEventsCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IcalExportRequest'
      responses:
        '200':
          description: iCalendar file.
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v2/search:
    get:
      tags: [Search]
      summary: Search across modules, courses, and events
      operationId: searchAll
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: types
          in: query
          description: Resource types to include in the federated search.
          schema:
            type: array
            items:
              type: string
              enum: [module, course, event]
          style: form
          explode: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Federated search result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /api/v2/catalog/faculties:
    get:
      tags: [Catalog]
      summary: List faculties
      description: Distinct faculty metadata derived from crawl roots and parsed paths.
      operationId: listFaculties
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Faculty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyListResponse'

  /api/v2/catalog/faculties/{facultyId}:
    get:
      tags: [Catalog]
      summary: Get faculty by ID
      operationId: getFaculty
      parameters:
        - name: facultyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Faculty details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/catalog/semesters:
    get:
      tags: [Catalog]
      summary: List semesters
      operationId: listSemesters
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Semester list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterListResponse'

  /api/v2/catalog/semesters/{semesterId}:
    get:
      tags: [Catalog]
      summary: Get semester by ID
      operationId: getSemester
      parameters:
        - name: semesterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Semester details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/catalog/degrees:
    get:
      tags: [Catalog]
      summary: List degree programs
      description: Distinct degree-program metadata extracted from path data.
      operationId: listDegreePrograms
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/SemesterId'
      responses:
        '200':
          description: Degree-program list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DegreeProgramListResponse'

  /api/v2/courses/{courseId}/modules:
    get:
      tags: [Courses]
      summary: List linked modules for a course
      description: |
        Future-compatible relation endpoint for a potential many-to-many course-module model.
      operationId: listModulesForCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Linked modules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModuleSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/schedule/weekly-slots:
    get:
      tags: [Schedule]
      summary: Get normalized weekly schedule slots
      description: |
        Returns events collapsed into recurring weekly slots to support planner-style clients.
      operationId: getWeeklySlots
      parameters:
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/DegreeProgram'
        - name: module_id
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: weekday
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 6
          style: form
          explode: true
        - $ref: '#/components/parameters/EventStartTimeGte'
        - $ref: '#/components/parameters/EventEndTimeLte'
      responses:
        '200':
          description: Normalized weekly slot list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySlotListResponse'

  /api/v2/schedule/rooms/{roomId}/day:
    get:
      tags: [Schedule, Rooms]
      summary: Get one-day room schedule
      operationId: getRoomDaySchedule
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/EventDate'
      responses:
        '200':
          description: Ordered room schedule for a single date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDayScheduleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/changes:
    get:
      tags: [Search]
      summary: List changed entities since a timestamp
      description: |
        Incremental sync endpoint for clients that keep a local cache and only need deltas.
      operationId: listChanges
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [module, course, event]
          style: form
          explode: true
        - name: include_deleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Changed entities and tombstones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'

  /api/v2/ingestion/runs:
    get:
      tags: [Ingestion]
      summary: List crawl/re-crawl runs
      operationId: listIngestionRuns
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [queued, running, succeeded, failed, canceled]
          style: form
          explode: true
        - name: started_after
          in: query
          schema:
            type: string
            format: date-time
        - name: started_before
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Crawl run list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRunListResponse'
    post:
      tags: [Ingestion]
      summary: Start a crawl/re-crawl run
      description: |
        Triggers a new crawl run. Supports full runs and targeted incremental updates.
      operationId: startIngestionRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRunCreateRequest'
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRun'

  /api/v2/ingestion/runs/{runId}:
    get:
      tags: [Ingestion]
      summary: Get crawl/re-crawl run details
      operationId: getIngestionRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/ingestion/runs/{runId}/logs:
    get:
      tags: [Ingestion]
      summary: Get crawl/re-crawl run logs
      operationId: getIngestionRunLogs
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [debug, info, warning, error]
          style: form
          explode: true
      responses:
        '200':
          description: Run logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRunLogsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Q:
      name: q
      in: query
      description: Free-text search over the primary searchable text fields of the resource.
      schema:
        type: string
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SemesterId:
      name: semester_id
      in: query
      description: Filter by semester identifier.
      schema:
        type: string
    FacultyId:
      name: faculty_id
      in: query
      description: Filter by faculty identifier.
      schema:
        type: string
    DegreeProgram:
      name: degree_program
      in: query
      description: Filter by degree-program identifier or name.
      schema:
        type: string
    UpdatedSince:
      name: updated_since
      in: query
      description: Return entities updated on or after this timestamp.
      schema:
        type: string
        format: date-time
    UpdatedUntil:
      name: updated_until
      in: query
      description: Return entities updated on or before this timestamp.
      schema:
        type: string
        format: date-time
    IncludeArchived:
      name: include_archived
      in: query
      description: Include archived/inactive catalog entries.
      schema:
        type: boolean
        default: false
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: integer
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    ModuleInclude:
      name: include
      in: query
      description: Related resources to include in the response.
      schema:
        type: array
        items:
          type: string
          enum: [courses, events]
      style: form
      explode: false
    CourseInclude:
      name: include
      in: query
      description: Related resources to include in the response.
      schema:
        type: array
        items:
          type: string
          enum: [module, events]
      style: form
      explode: false
    EventInclude:
      name: include
      in: query
      description: Related resources to include in the response.
      schema:
        type: array
        items:
          type: string
          enum: [course, module, room]
      style: form
      explode: false
    ModuleFields:
      name: fields
      in: query
      description: Sparse fieldset for modules.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ModuleField'
      style: form
      explode: false
    CourseFields:
      name: fields
      in: query
      description: Sparse fieldset for courses.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CourseField'
      style: form
      explode: false
    EventFields:
      name: fields
      in: query
      description: Sparse fieldset for events.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EventField'
      style: form
      explode: false
    ModuleSort:
      name: sort
      in: query
      description: Sort expression. Prefix with `-` for descending.
      schema:
        type: string
        enum:
          - name
          - -name
          - number
          - -number
          - credits
          - -credits
          - duration_semesters
          - -duration_semesters
    CourseSort:
      name: sort
      in: query
      description: Sort expression. Prefix with `-` for descending.
      schema:
        type: string
        enum:
          - name
          - -name
          - number
          - -number
          - type
          - -type
          - weekly_hours
          - -weekly_hours
    EventSort:
      name: sort
      in: query
      description: Sort expression. Prefix with `-` for descending.
      schema:
        type: string
        enum:
          - event_date
          - -event_date
          - start_time
          - -start_time
          - end_time
          - -end_time
          - location
          - -location
    EventDate:
      name: date
      in: query
      description: Exact event date.
      schema:
        type: string
        format: date
    EventDateFrom:
      name: date_from
      in: query
      description: Include events on or after this date.
      schema:
        type: string
        format: date
    EventDateTo:
      name: date_to
      in: query
      description: Include events on or before this date.
      schema:
        type: string
        format: date
    EventWeekday:
      name: weekday
      in: query
      description: 0 = Sunday, 1 = Monday, ..., 6 = Saturday.
      schema:
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 6
      style: form
      explode: true
    EventStartTimeGte:
      name: start_time_gte
      in: query
      description: Include events starting at or after this time.
      schema:
        type: string
        format: time
    EventEndTimeLte:
      name: end_time_lte
      in: query
      description: Include events ending at or before this time.
      schema:
        type: string
        format: time
    EventOverlapsTime:
      name: overlaps_time
      in: query
      description: Include events active at this time.
      schema:
        type: string
        format: time

  responses:
    BadRequest:
      description: The supplied request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ModuleField:
      type: string
      enum:
        - id
        - name
        - number
        - path
        - responsible_person
        - duration_semesters
        - credits
        - start_semester
        - frequency
        - goals
        - content
        - exam_prerequisites
        - prerequisites
        - has_courses
        - has_events
    CourseField:
      type: string
      enum:
        - id
        - name
        - number
        - staff
        - type
        - weekly_hours
        - language
        - module_id
        - has_events
    EventField:
      type: string
      enum:
        - id
        - course_id
        - number
        - event_date
        - start_time
        - end_time
        - duration_minutes
        - location
        - building
        - room
        - staff

    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    ModuleSummary:
      type: object
      required:
        - id
        - name
        - number
        - path
        - responsible_person
        - duration_semesters
        - credits
        - start_semester
        - frequency
      properties:
        id:
          type: integer
        semester_id:
          type: string
        faculty_id:
          type: string
        degree_program:
          type: string
        recommended_study_semester:
          type: integer
          minimum: 1
        name:
          type: string
        number:
          type: string
        path:
          type: array
          items:
            type: string
        responsible_person:
          type: string
        duration_semesters:
          type: integer
        credits:
          type: number
        start_semester:
          type: string
        frequency:
          type: string
        has_courses:
          type: boolean
        has_events:
          type: boolean
        last_updated:
          type: string
          format: date-time

    ModuleDetail:
      allOf:
        - $ref: '#/components/schemas/ModuleSummary'
        - type: object
          properties:
            goals:
              type: string
            content:
              type: string
            exam_prerequisites:
              type: string
            prerequisites:
              type: object
              additionalProperties:
                type: string
            courses:
              type: array
              items:
                $ref: '#/components/schemas/CourseSummary'
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'

    CourseSummary:
      type: object
      required:
        - id
        - name
        - number
        - staff
        - type
        - weekly_hours
        - language
        - module_id
      properties:
        id:
          type: integer
        semester_id:
          type: string
        faculty_id:
          type: string
        degree_program:
          type: string
        recommended_study_semester:
          type: integer
          minimum: 1
        name:
          type: string
        number:
          type: string
        staff:
          type: array
          items:
            type: string
        type:
          type: string
        weekly_hours:
          type: integer
        language:
          type: string
        module_id:
          type: integer
        has_events:
          type: boolean
        last_updated:
          type: string
          format: date-time

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          properties:
            module:
              $ref: '#/components/schemas/ModuleSummary'
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'

    EventSummary:
      type: object
      required:
        - id
        - course_id
        - number
        - event_date
        - start_time
        - end_time
        - location
        - staff
      properties:
        id:
          type: integer
        semester_id:
          type: string
        faculty_id:
          type: string
        degree_program:
          type: string
        course_id:
          type: integer
        number:
          type: string
        event_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        duration_minutes:
          type: integer
          minimum: 0
        location:
          type: string
        building:
          type: string
          nullable: true
        room:
          type: string
          nullable: true
        staff:
          type: array
          items:
            type: string
        is_online:
          type: boolean
        recurrence_key:
          type: string
          nullable: true
        source_hash:
          type: string
          nullable: true
        last_updated:
          type: string
          format: date-time

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            course:
              $ref: '#/components/schemas/CourseSummary'
            module:
              $ref: '#/components/schemas/ModuleSummary'
            room_entity:
              $ref: '#/components/schemas/RoomSummary'

    RoomSummary:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        semester_id:
          type: string
        faculty_id:
          type: string
        label:
          type: string
        building:
          type: string
          nullable: true
        room_code:
          type: string
          nullable: true
        has_upcoming_events:
          type: boolean
        last_updated:
          type: string
          format: date-time

    Faculty:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
          nullable: true
        active:
          type: boolean
        semesters:
          type: array
          items:
            type: string

    FacultyListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Faculty'

    Semester:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        season:
          type: string
          enum: [winter, summer, unknown]
        year:
          type: integer
        active:
          type: boolean

    SemesterListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Semester'

    DegreeProgram:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        degree_type:
          type: string
          nullable: true
        faculty_id:
          type: string
          nullable: true

    DegreeProgramListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DegreeProgram'

    WeeklySlot:
      type: object
      required:
        - weekday
        - start_time
        - end_time
        - courses
        - modules
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        room:
          type: string
          nullable: true
        building:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleSummary'
        sample_event_ids:
          type: array
          items:
            type: integer

    WeeklySlotListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeeklySlot'

    RoomDayScheduleResponse:
      type: object
      required: [room, date, items]
      properties:
        room:
          $ref: '#/components/schemas/RoomSummary'
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'

    ChangeItem:
      type: object
      required: [resource_type, resource_id, action, changed_at]
      properties:
        resource_type:
          type: string
          enum: [module, course, event]
        resource_id:
          type: string
        action:
          type: string
          enum: [created, updated, deleted]
        changed_at:
          type: string
          format: date-time
        item:
          oneOf:
            - $ref: '#/components/schemas/ModuleSummary'
            - $ref: '#/components/schemas/CourseSummary'
            - $ref: '#/components/schemas/EventSummary'

    ChangesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeItem'

    IngestionRun:
      type: object
      required: [id, status, started_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        started_at:
          type: string
