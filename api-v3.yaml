        - name: language
          in: query
          schema: { type: string }
        - name: planung
          in: query
          schema: { type: string }
        - name: credits_min
          in: query
          schema: { type: integer }
        - name: credits_max
          in: query
          schema: { type: integer }
        - name: degree_id
          in: query
          schema: { type: integer }
        - name: semester
          in: query
