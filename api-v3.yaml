        Ideal for room-booking UIs and digital signage.
      operationId: getRoomAvailability
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: day_start
          in: query
          schema:
            type: string
            format: time
            default: '08:00:00'
        - name: day_end
          in: query
          schema:
            type: string
            format: time
            default: '20:00:00'
      responses:
        '200':
