  # =========================================================================
  /api/v3/schedule/timetable:
    get:
      tags: [Schedule]
      summary: Weekly timetable view
      description: |
        Returns events grouped by weekday and sorted by time, collapsed into
        recurring weekly slots when possible. Primary endpoint for timetable UIs.
      operationId: getWeeklyTimetable
      parameters:
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/DegreeProgram'
        - name: module_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: weekday
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 6
          style: form
          explode: true
        - name: start_time_gte
          in: query
          schema:
            type: string
            format: time
        - name: end_time_lte
          in: query
          schema:
            type: string
            format: time
      responses:
        '200':
          description: Weekly timetable slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableResponse'

  /api/v3/schedule/free-slots:
    get:
      tags: [Schedule]
      summary: Find free schedule slots
      description: |
        Returns available time windows for a date range, useful for "find a gap" UIs.
      operationId: findFreeSlots
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - name: module_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: day_start
          in: query
          schema:
            type: string
            format: time
            default: '08:00:00'
        - name: day_end
          in: query
          schema:
            type: string
            format: time
            default: '20:00:00'
        - name: min_duration_minutes
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 720
            default: 30
        - name: exclude_online
          in: query
          description: Ignore online-only events when computing occupancy.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Available time windows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeSlotListResponse'

