openapi: 3.1.0
info:
  title: AlmaWeb API
  version: 3.0.0-proposal
  summary: Resource-oriented API with separated filter endpoints
  description: |
    Next-generation AlmaWeb API structure.

    ## Design goals

    - **Slim GET endpoints**: Collection GETs carry only the 5-6 most common filters.
      Complex filtering moves to dedicated `POST …/filter` sub-endpoints.
    - **Dedicated sub-endpoints for cross-cutting concerns**:
      `…/filter`, `…/facets`, `…/count`, `…/distinct/{field}`.
    - **First-class Staff resource**: Staff extracted from courses/events into its own
      collection with relation endpoints.
    - **Convenience shortcuts**: `/events/today`, `/events/upcoming`, `/schedule/timetable`.
    - **Relation endpoints over filter duplication**: Navigate the object graph via
      `/{resource}/{id}/{child}` instead of repeating parent filters on every collection.
    - **Consistent naming**: `snake_case` everywhere, plural resource names, `_gte`/`_lte`
      suffixes for range filters.
    - **RFC 9457 Problem Details** for all error responses.
    - **Legacy compatibility layer** preserved under `/api/` (unversioned, deprecated).

    ## Endpoint taxonomy

    | Pattern | Verb | Purpose |
    |---------|------|---------|
    | `/{resource}` | GET | List with common filters |
    | `/{resource}/filter` | POST | Advanced boolean filter |
    | `/{resource}/facets` | POST | Facet buckets (optionally narrowed) |
    | `/{resource}/count` | POST | Fast count without payload |
    | `/{resource}/distinct/{field}` | GET | Unique values for a field |
    | `/{resource}/{id}` | GET | Single item |
    | `/{resource}/{id}/{child}` | GET | Relation traversal |
    | `/{resource}/{id}/calendar.ics` | GET | iCal export for one item |

  contact:
    name: AlmaWeb Parser Maintainers
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Modules
    description: University modules (Lehrveranstaltungen).
  - name: Courses
    description: Schedulable course units within modules.
  - name: Events
    description: Concrete timetable occurrences of courses.
  - name: Staff
    description: Teaching staff extracted from courses and events.
  - name: Rooms
    description: Normalized room/building entities (requires room parsing).
  - name: Schedule
    description: Planner-oriented views (timetable, free slots, conflicts).
  - name: Catalog
    description: Reference data — faculties, semesters, degree programs.
  - name: Search
    description: Cross-resource search and autocomplete.
  - name: Exports
    description: Bulk data exports (iCal, CSV).
  - name: Admin
    description: Ingestion runs and operational endpoints.
  - name: Compatibility
    description: Deprecated v1 endpoints for existing clients.

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:

  # =========================================================================
  # HEALTH
  # =========================================================================
  /api/v3/health:
    get:
      tags: [Admin]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
                  database:
                    type: string
                    enum: [ok, degraded, down]

  /api/v3/stats:
    get:
      tags: [Admin]
      summary: Global statistics
      description: Quick dashboard numbers — total modules, courses, events, last crawl time.
      operationId: getGlobalStats
      responses:
        '200':
          description: Aggregate counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStats'

  # =========================================================================
  # MODULES
  # =========================================================================
  /api/v3/modules:
    get:
      tags: [Modules]
      summary: List modules
      description: |
        Returns modules filtered by the most common criteria.
        For complex boolean queries, use `POST /api/v3/modules/filter`.
      operationId: listModules
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/DegreeProgram'
        - name: name
          in: query
          description: Case-insensitive partial match on module name. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: module_number
          in: query
          description: Case-insensitive partial match on module number. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: responsible_person
          in: query
          description: Case-insensitive partial match on responsible person. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: credits_gte
          in: query
          schema: { type: number }
        - name: credits_lte
          in: query
          schema: { type: number }
        - $ref: '#/components/parameters/ModuleInclude'
        - $ref: '#/components/parameters/ModuleFields'
        - $ref: '#/components/parameters/ModuleSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated module list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v3/modules/filter:
    post:
      tags: [Modules]
      summary: Filter modules with advanced criteria
      description: |
        Accepts a full filter object with nested boolean logic, range filters,
        path matching, and cross-entity conditions that would be impractical as
        query strings.
      operationId: filterModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleFilterRequest'
      responses:
        '200':
          description: Filtered module list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v3/modules/facets:
    post:
      tags: [Modules]
      summary: Get module facets
      description: |
        Returns value counts for filterable fields. Optionally supply a filter
        body to compute facets for a narrowed result set.
      operationId: getModuleFacets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacetRequest'
      responses:
        '200':
          description: Facet buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleFacetsResponse'

  /api/v3/modules/count:
    post:
      tags: [Modules]
      summary: Count modules matching a filter
      description: Returns only the count — no items. Useful for badge numbers and dashboards.
      operationId: countModules
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleFilter'
      responses:
        '200':
          description: Count result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'

  /api/v3/modules/distinct/{field}:
    get:
      tags: [Modules]
      summary: Get distinct values for a module field
      description: |
        Returns the unique values for the given field, with optional counts.
        Useful for populating dropdown lists in UIs.
      operationId: getModuleDistinct
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum:
              - responsible_person
              - start_semester
              - frequency
              - credits
              - duration_semesters
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - name: include_counts
          in: query
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Distinct values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistinctValuesResponse'

  /api/v3/modules/{module_id}:
    get:
      tags: [Modules]
      summary: Get module by ID
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ModuleInclude'
        - $ref: '#/components/parameters/ModuleFields'
      responses:
        '200':
          description: Module details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/modules/{module_id}/courses:
    get:
      tags: [Modules]
      summary: List courses for a module
      operationId: listCoursesForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: type
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: language
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: staff
          in: query
          description: Case-insensitive partial match on course staff. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: has_events
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/CourseInclude'
        - $ref: '#/components/parameters/CourseFields'
        - $ref: '#/components/parameters/CourseSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Courses belonging to the module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/modules/{module_id}/events:
    get:
      tags: [Modules]
      summary: List events for a module
      description: Flattened events across all courses of this module.
      operationId: listEventsForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - name: staff
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Events under this module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/modules/{module_id}/staff:
    get:
      tags: [Modules, Staff]
      summary: List staff involved in a module
      operationId: listStaffForModule
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200':
          description: Staff members linked to this module's courses/events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/modules/{module_id}/related:
    get:
      tags: [Modules]
      summary: List related modules
      description: |
        Returns modules sharing the same path prefix (i.e. same degree program
        and category). Useful for "students who take this also take…" UIs.
      operationId: listRelatedModules
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: depth
          in: query
          description: Number of path segments to match (from root). Fewer = broader.
          schema:
            type: integer
            minimum: 1
            default: 3
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Related modules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/modules/{module_id}/calendar.ics:
    get:
      tags: [Modules, Exports]
      summary: Export module schedule as iCalendar
      operationId: exportModuleCalendar
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
      responses:
        '200':
          description: iCalendar file.
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # COURSES
  # =========================================================================
  /api/v3/courses:
    get:
      tags: [Courses]
      summary: List courses
      description: |
        Returns courses with lightweight filters.
        Prefer relation endpoints (`/modules/{id}/courses`) when the parent is known.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/DegreeProgram'
        - name: name
          in: query
          description: Case-insensitive partial match. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: type
          in: query
          description: Course type (Vorlesung, Seminar, …). Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: language
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: staff
          in: query
          description: Case-insensitive partial match on staff. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: module_id
          in: query
          description: Filter by parent module ID(s). Repeatable OR.
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: has_events
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/CourseInclude'
        - $ref: '#/components/parameters/CourseFields'
        - $ref: '#/components/parameters/CourseSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated course list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v3/courses/filter:
    post:
      tags: [Courses]
      summary: Filter courses with advanced criteria
      operationId: filterCourses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseFilterRequest'
      responses:
        '200':
          description: Filtered course list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v3/courses/facets:
    post:
      tags: [Courses]
      summary: Get course facets
      operationId: getCourseFacets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacetRequest'
      responses:
        '200':
          description: Facet buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseFacetsResponse'

  /api/v3/courses/count:
    post:
      tags: [Courses]
      summary: Count courses matching a filter
      operationId: countCourses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseFilter'
      responses:
        '200':
          description: Count result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'

  /api/v3/courses/distinct/{field}:
    get:
      tags: [Courses]
      summary: Get distinct values for a course field
      operationId: getCourseDistinct
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum: [type, language, staff, weekly_hours]
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - name: include_counts
          in: query
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Distinct values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistinctValuesResponse'

  /api/v3/courses/{course_id}:
    get:
      tags: [Courses]
      summary: Get course by ID
      operationId: getCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/CourseInclude'
        - $ref: '#/components/parameters/CourseFields'
      responses:
        '200':
          description: Course details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/courses/{course_id}/module:
    get:
      tags: [Courses]
      summary: Get the parent module of a course
      operationId: getCourseModule
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Parent module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/courses/{course_id}/events:
    get:
      tags: [Courses]
      summary: List events for a course
      operationId: listEventsForCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - name: staff
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Events for this course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/courses/{course_id}/staff:
    get:
      tags: [Courses, Staff]
      summary: List staff for a course
      operationId: listStaffForCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Staff members for this course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/courses/{course_id}/calendar.ics:
    get:
      tags: [Courses, Exports]
      summary: Export course schedule as iCalendar
      operationId: exportCourseCalendar
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
      responses:
        '200':
          description: iCalendar file.
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # EVENTS
  # =========================================================================
  /api/v3/events:
    get:
      tags: [Events]
      summary: List events
      description: |
        Lightweight filters for the most common use cases.
        Use `POST /api/v3/events/filter` for complex queries.
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - $ref: '#/components/parameters/EventWeekday'
        - name: staff
          in: query
          description: Case-insensitive partial match on event staff. Repeatable OR.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: location
          in: query
          description: Case-insensitive partial match on location text.
          schema: { type: string }
        - name: course_id
          in: query
          description: Filter by parent course ID(s). Repeatable OR.
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: module_id
          in: query
          description: Filter by grandparent module ID(s). Repeatable OR.
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - $ref: '#/components/parameters/EventInclude'
        - $ref: '#/components/parameters/EventFields'
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v3/events/filter:
    post:
      tags: [Events]
      summary: Filter events with advanced criteria
      description: |
        Full filter object with time-range overlaps, duration filters,
        online/canceled flags, cross-entity conditions, and boolean logic.
      operationId: filterEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFilterRequest'
      responses:
        '200':
          description: Filtered event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v3/events/facets:
    post:
      tags: [Events]
      summary: Get event facets
      operationId: getEventFacets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacetRequest'
      responses:
        '200':
          description: Facet buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFacetsResponse'

  /api/v3/events/count:
    post:
      tags: [Events]
      summary: Count events matching a filter
      operationId: countEvents
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFilter'
      responses:
        '200':
          description: Count result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'

  /api/v3/events/distinct/{field}:
    get:
      tags: [Events]
      summary: Get distinct values for an event field
      operationId: getEventDistinct
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum: [location, building, room, staff]
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/EventDateFrom'
        - $ref: '#/components/parameters/EventDateTo'
        - name: include_counts
          in: query
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Distinct values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistinctValuesResponse'

  /api/v3/events/today:
    get:
      tags: [Events]
      summary: List today's events
      description: Convenience shortcut equivalent to `date_from=today&date_to=today`.
      operationId: listEventsToday
      parameters:
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - name: module_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - $ref: '#/components/parameters/EventInclude'
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Today's events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'

  /api/v3/events/upcoming:
    get:
      tags: [Events]
      summary: List upcoming events
      description: |
        Returns events in the next N days from now. Defaults to 7 days.
      operationId: listEventsUpcoming
      parameters:
        - name: days
          in: query
          description: Number of days ahead to include. Default 7, max 90.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - $ref: '#/components/parameters/SemesterId'
        - $ref: '#/components/parameters/FacultyId'
        - name: module_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - name: course_id
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
        - $ref: '#/components/parameters/EventInclude'
        - $ref: '#/components/parameters/EventSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
