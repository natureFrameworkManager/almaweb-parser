# ===========================================================================
# COMPONENTS
# ===========================================================================
components:
  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------
  parameters:
    Q:
      name: q
      in: query
      description: Free-text search across primary text fields.
      schema: { type: string }
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SemesterId:
      name: semester_id
      in: query
      description: Filter by semester identifier.
      schema: { type: string }
    FacultyId:
      name: faculty_id
      in: query
      description: Filter by faculty identifier.
      schema: { type: string }
    DegreeProgram:
      name: degree_program
      in: query
      description: Filter by degree program identifier or name.
      schema: { type: string }
    ModuleId:
      name: module_id
      in: path
      required: true
      schema: { type: integer }
    CourseId:
      name: course_id
      in: path
      required: true
      schema: { type: integer }
    EventId:
      name: event_id
      in: path
      required: true
      schema: { type: integer }
    StaffId:
      name: staff_id
      in: path
      required: true
      schema: { type: string }
    RoomId:
      name: room_id
      in: path
      required: true
      schema: { type: string }

    # Include / fields / sort per resource
    ModuleInclude:
      name: include
      in: query
      description: Related resources to embed.
      schema:
        type: array
        items:
          type: string
          enum: [courses, events, staff]
      style: form
      explode: false
    CourseInclude:
      name: include
      in: query
      description: Related resources to embed.
      schema:
        type: array
        items:
          type: string
          enum: [module, events, staff]
      style: form
      explode: false
    EventInclude:
      name: include
      in: query
      description: Related resources to embed.
      schema:
        type: array
        items:
          type: string
          enum: [course, module, room]
      style: form
      explode: false
    ModuleFields:
      name: fields
      in: query
      description: Sparse fieldset.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ModuleFieldEnum'
      style: form
      explode: false
    CourseFields:
      name: fields
      in: query
      description: Sparse fieldset.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CourseFieldEnum'
      style: form
      explode: false
    EventFields:
      name: fields
      in: query
      description: Sparse fieldset.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EventFieldEnum'
      style: form
      explode: false
    ModuleSort:
      name: sort
      in: query
      description: "Sort expression. Prefix `-` for descending."
      schema:
        type: string
        enum: [name, -name, number, -number, credits, -credits, duration_semesters, -duration_semesters]
    CourseSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, -name, number, -number, type, -type, weekly_hours, -weekly_hours]
    EventSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [event_date, -event_date, start_time, -start_time, end_time, -end_time, location, -location]

    # Event date/time helpers
    EventDateFrom:
      name: date_from
      in: query
      description: Include events on or after this date.
      schema:
        type: string
        format: date
    EventDateTo:
      name: date_to
      in: query
      description: Include events on or before this date.
      schema:
        type: string
        format: date
    EventWeekday:
      name: weekday
      in: query
      description: "0 = Sunday, 1 = Monday, …, 6 = Saturday. Repeatable OR."
      schema:
        type: array
        items:
          type: integer
          minimum: 0
          maximum: 6
      style: form
      explode: true

  # -------------------------------------------------------------------------
  # Responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # -- Field enums -------------------------------------------------------
    ModuleFieldEnum:
      type: string
      enum: [id, name, number, path, responsible_person, duration_semesters, credits, start_semester, frequency, goals, content, exam_prerequisites, prerequisites]
    CourseFieldEnum:
      type: string
      enum: [id, name, number, staff, type, weekly_hours, language, module_id]
    EventFieldEnum:
      type: string
      enum: [id, course_id, number, event_date, start_time, end_time, duration_minutes, location, building, room, staff]

    # -- Pagination --------------------------------------------------------
    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    # -- Error (RFC 9457) --------------------------------------------------
    Problem:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    # -- Count / Distinct --------------------------------------------------
    CountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0

    DistinctValue:
      type: object
      required: [value]
      properties:
        value:
          oneOf:
            - type: string
            - type: number
        count:
          type: integer
          minimum: 0

    DistinctValuesResponse:
      type: object
      required: [field, items]
      properties:
        field:
          type: string
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DistinctValue'

    # -- Global stats ------------------------------------------------------
    GlobalStats:
      type: object
      required: [modules, courses, events]
      properties:
        modules:
          type: integer
        courses:
          type: integer
        events:
          type: integer
        staff:
          type: integer
        rooms:
          type: integer
        last_crawl:
          type: string
          format: date-time
          nullable: true

    # -- Module schemas ----------------------------------------------------
    ModuleSummary:
      type: object
      required: [id, name, number, path, responsible_person, duration_semesters, credits, start_semester, frequency]
      properties:
        id: { type: integer }
        name: { type: string }
        number: { type: string }
        path:
          type: array
          items: { type: string }
        responsible_person: { type: string }
        duration_semesters: { type: integer }
        credits: { type: number }
        start_semester: { type: string }
        frequency: { type: string }
        semester_id: { type: string }
        faculty_id: { type: string }
        degree_program: { type: string }
        recommended_study_semester:
          type: integer
          minimum: 1
        has_courses: { type: boolean }
        has_events: { type: boolean }
        last_updated:
          type: string
          format: date-time

    ModuleDetail:
      allOf:
        - $ref: '#/components/schemas/ModuleSummary'
        - type: object
          properties:
            goals: { type: string }
            content: { type: string }
            exam_prerequisites: { type: string }
            prerequisites:
              type: object
              additionalProperties: { type: string }
            courses:
              type: array
              items:
                $ref: '#/components/schemas/CourseSummary'
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'
            staff:
              type: array
              items:
                $ref: '#/components/schemas/StaffSummary'

    ModuleListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModuleSummary'

    # -- Course schemas ----------------------------------------------------
    CourseSummary:
      type: object
      required: [id, name, number, staff, type, weekly_hours, language, module_id]
      properties:
        id: { type: integer }
        name: { type: string }
        number: { type: string }
        staff:
          type: array
          items: { type: string }
        type: { type: string }
        weekly_hours: { type: integer }
        language: { type: string }
        module_id: { type: integer }
        has_events: { type: boolean }
        last_updated:
          type: string
          format: date-time

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          properties:
            module:
              $ref: '#/components/schemas/ModuleSummary'
            events:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'
            staff_entities:
              type: array
              items:
                $ref: '#/components/schemas/StaffSummary'

    CourseListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'

    # -- Event schemas -----------------------------------------------------
    EventSummary:
      type: object
      required: [id, course_id, number, event_date, start_time, end_time, location, staff]
      properties:
        id: { type: integer }
        course_id: { type: integer }
        number: { type: string }
        event_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        duration_minutes:
          type: integer
          minimum: 0
        location: { type: string }
        building:
          type: string
          nullable: true
        room:
          type: string
          nullable: true
        staff:
          type: array
          items: { type: string }
        is_online: { type: boolean }
        is_canceled: { type: boolean }
        last_updated:
          type: string
          format: date-time

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            course:
              $ref: '#/components/schemas/CourseSummary'
            module:
              $ref: '#/components/schemas/ModuleSummary'
            room_entity:
              $ref: '#/components/schemas/RoomSummary'

    EventListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'

    # -- Staff schemas -----------------------------------------------------
    StaffSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        course_count: { type: integer }
        event_count: { type: integer }

    StaffDetail:
      allOf:
        - $ref: '#/components/schemas/StaffSummary'
        - type: object
          properties:
            courses:
              type: array
              items:
                $ref: '#/components/schemas/CourseSummary'
            modules:
              type: array
              items:
                $ref: '#/components/schemas/ModuleSummary'

    StaffListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffSummary'

    # -- Room schemas ------------------------------------------------------
    RoomSummary:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        building:
          type: string
          nullable: true
        room_code:
          type: string
          nullable: true
        has_upcoming_events: { type: boolean }

    RoomDetail:
      allOf:
        - $ref: '#/components/schemas/RoomSummary'
        - type: object
          properties:
            aliases:
              type: array
              items: { type: string }
            raw_locations:
              type: array
              items: { type: string }

    RoomListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomSummary'

    RoomAvailabilityResponse:
      type: object
      required: [room, date, occupied, free]
      properties:
        room:
          $ref: '#/components/schemas/RoomSummary'
        date:
          type: string
          format: date
        occupied:
          type: array
          items:
            type: object
            required: [start_time, end_time, event]
            properties:
              start_time:
                type: string
                format: time
              end_time:
                type: string
                format: time
              event:
                $ref: '#/components/schemas/EventSummary'
        free:
          type: array
          items:
            type: object
            required: [start_time, end_time, duration_minutes]
            properties:
              start_time:
                type: string
                format: time
              end_time:
                type: string
                format: time
              duration_minutes:
                type: integer
                minimum: 1

    # -- Catalog schemas ---------------------------------------------------
    Faculty:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        code:
          type: string
          nullable: true
        active: { type: boolean }
        semesters:
          type: array
          items: { type: string }

    FacultyListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Faculty'

    Semester:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        season:
          type: string
          enum: [winter, summer, unknown]
        year: { type: integer }
        active: { type: boolean }

    SemesterListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Semester'

    DegreeProgram:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        degree_type:
          type: string
          nullable: true
        faculty_id:
          type: string
          nullable: true

    DegreeProgramListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DegreeProgram'

    # -- Filter schemas (POST bodies) --------------------------------------
    ModuleFilter:
      type: object
      description: All available module filter fields for advanced queries.
      properties:
        q: { type: string }
        id:
          type: array
          items: { type: integer }
        semester_id: { type: string }
        faculty_id: { type: string }
        degree_program: { type: string }
        updated_since:
          type: string
          format: date-time
        updated_until:
          type: string
          format: date-time
        name:
          type: array
          items: { type: string }
        module_number:
          type: array
          items: { type: string }
        responsible_person:
          type: array
          items: { type: string }
        start_semester:
          type: array
          items: { type: string }
        frequency:
          type: array
          items: { type: string }
        credits_gte: { type: number }
        credits_lte: { type: number }
        duration_semesters_gte: { type: integer, minimum: 0 }
        duration_semesters_lte: { type: integer, minimum: 0 }
        path_prefix:
          description: Exact prefix match on the normalized path string joined by ` > `.
          type: string
        path_contains:
          description: Partial match on the normalized path string.
          type: string
        has_courses: { type: boolean }
        has_events: { type: boolean }
        recommended_study_semester_gte: { type: integer, minimum: 1 }
        recommended_study_semester_lte: { type: integer, minimum: 1 }
        goals_contains: { type: string }
        content_contains: { type: string }

    CourseFilter:
      type: object
      properties:
        q: { type: string }
        id:
          type: array
          items: { type: integer }
        semester_id: { type: string }
        faculty_id: { type: string }
        degree_program: { type: string }
        updated_since:
          type: string
          format: date-time
        updated_until:
          type: string
          format: date-time
        name:
          type: array
          items: { type: string }
        number:
          type: array
          items: { type: string }
        type:
          type: array
          items: { type: string }
        language:
          type: array
          items: { type: string }
        staff:
          description: Case-insensitive partial match. Repeatable OR.
          type: array
          items: { type: string }
        staff_exact:
          description: Exact staff-member match. Repeatable OR.
          type: array
          items: { type: string }
        has_events: { type: boolean }
        weekly_hours_gte: { type: integer, minimum: 0 }
        weekly_hours_lte: { type: integer, minimum: 0 }
        module_id:
          type: array
          items: { type: integer }
        module_number:
          type: array
          items: { type: string }
        module_name:
          type: array
          items: { type: string }
        weekday:
          description: Filter courses that have events on these weekdays.
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        event_date_from:
          type: string
          format: date
        event_date_to:
          type: string
          format: date
        study_semester_gte: { type: integer, minimum: 1 }
        study_semester_lte: { type: integer, minimum: 1 }
        has_online_events: { type: boolean }

    EventFilter:
      type: object
      properties:
        q: { type: string }
        id:
          type: array
          items: { type: integer }
        semester_id: { type: string }
        faculty_id: { type: string }
        degree_program: { type: string }
        updated_since:
          type: string
          format: date-time
        updated_until:
          type: string
          format: date-time
        date:
          type: string
          format: date
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        weekday:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        start_time_gte:
          type: string
          format: time
        end_time_lte:
          type: string
          format: time
        overlaps_time:
          description: Include events active at this time of day.
          type: string
          format: time
        location: { type: string }
        room: { type: string }
        building: { type: string }
        staff:
          type: array
          items: { type: string }
        staff_exact:
          type: array
          items: { type: string }
        has_room: { type: boolean }
        is_online: { type: boolean }
        is_canceled: { type: boolean }
        exclude_id:
          description: Exclude specific event IDs from results.
          type: array
          items: { type: integer }
        course_id:
          type: array
          items: { type: integer }
        course_name:
          type: array
          items: { type: string }
        course_number:
          type: array
          items: { type: string }
        course_type:
          type: array
          items: { type: string }
        module_id:
          type: array
          items: { type: integer }
        module_name:
          type: array
          items: { type: string }
        module_number:
          type: array
          items: { type: string }
        duration_minutes_gte: { type: integer, minimum: 0 }
        duration_minutes_lte: { type: integer, minimum: 0 }

    # -- Composite filter requests -----------------------------------------
    LogicalOperator:
      type: string
      enum: [and, or]

    SortClause:
      type: object
      required: [field, direction]
      properties:
        field: { type: string }
        direction:
          type: string
          enum: [asc, desc]

    ModuleFilterRequest:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/LogicalOperator'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ModuleFilter'
        include:
          type: array
          items:
            type: string
            enum: [courses, events, staff]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ModuleFieldEnum'
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortClause'
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200, default: 50 }

    CourseFilterRequest:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/LogicalOperator'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/CourseFilter'
        include:
          type: array
          items:
            type: string
            enum: [module, events, staff]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CourseFieldEnum'
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortClause'
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200, default: 50 }

    EventFilterRequest:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/LogicalOperator'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/EventFilter'
        include:
          type: array
          items:
            type: string
            enum: [course, module, room]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EventFieldEnum'
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortClause'
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200, default: 50 }

    # -- Facet request/response --------------------------------------------
    FacetRequest:
      type: object
      description: |
        Optional filter body to narrow the dataset before computing facets.
        The actual filter shape depends on the resource (module/course/event).
        Omit entirely or send `{}` for unfiltered facets.
      properties:
        filter:
          description: Resource-specific filter object.
          type: object
        fields:
          description: Restrict facet computation to these fields only.
          type: array
          items: { type: string }

    FacetBucket:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, minimum: 0 }

    NumericFacet:
      type: object
      properties:
        min: { type: number }
        max: { type: number }

    ModuleFacetsResponse:
      type: object
      properties:
        start_semester:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        frequency:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        responsible_person:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        credits:
          $ref: '#/components/schemas/NumericFacet'
        duration_semesters:
          $ref: '#/components/schemas/NumericFacet'

    CourseFacetsResponse:
      type: object
      properties:
        type:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        language:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        staff:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        weekly_hours:
          $ref: '#/components/schemas/NumericFacet'

    EventFacetsResponse:
      type: object
      properties:
        weekday:
          type: array
          items:
            type: object
            required: [value, label, count]
            properties:
              value: { type: integer, minimum: 0, maximum: 6 }
              label: { type: string }
              count: { type: integer, minimum: 0 }
        building:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        room:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        course_type:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        staff:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        date_range:
          type: object
          properties:
            min:
              type: string
              format: date
            max:
              type: string
              format: date

    # -- Search schemas ----------------------------------------------------
    SearchResult:
      type: object
      required: [resource_type, score, item]
      properties:
        resource_type:
          type: string
          enum: [module, course, event, staff, room]
        score: { type: number }
        item:
          oneOf:
            - $ref: '#/components/schemas/ModuleSummary'
            - $ref: '#/components/schemas/CourseSummary'
            - $ref: '#/components/schemas/EventSummary'
            - $ref: '#/components/schemas/StaffSummary'
            - $ref: '#/components/schemas/RoomSummary'

    SearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    SuggestItem:
      type: object
      required: [resource_type, id, label]
      properties:
        resource_type:
          type: string
          enum: [module, course, event, staff, room, faculty, degree_program]
        id: { type: string }
        label: { type: string }
        subtitle:
          type: string
          nullable: true
        score: { type: number }
        matched_fields:
          type: array
          items: { type: string }

    SuggestResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SuggestItem'

    # -- Schedule schemas --------------------------------------------------
    TimetableSlot:
      type: object
      required: [weekday, start_time, end_time]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        location:
          type: string
          nullable: true
        building:
          type: string
          nullable: true
        room:
          type: string
          nullable: true
        course:
          $ref: '#/components/schemas/CourseSummary'
        module:
          $ref: '#/components/schemas/ModuleSummary'
        sample_event_ids:
          type: array
          items: { type: integer }

    TimetableResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimetableSlot'

    FreeSlot:
      type: object
      required: [date, start_time, end_time, duration_minutes]
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        duration_minutes: { type: integer, minimum: 1 }
        room:
          type: string
          nullable: true
        building:
          type: string
          nullable: true

    FreeSlotListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FreeSlot'

    ConflictPair:
      type: object
      required: [left, right, overlap_minutes]
      properties:
        left:
          $ref: '#/components/schemas/EventSummary'
        right:
          $ref: '#/components/schemas/EventSummary'
        overlap_minutes: { type: integer, minimum: 1 }

    ConflictGroup:
      type: object
      required: [key, conflicts]
      properties:
        key: { type: string }
        label:
          type: string
          nullable: true
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictPair'

    ConflictDetectionRequest:
      type: object
      required: [filter]
      properties:
        filter:
          $ref: '#/components/schemas/EventFilter'
        group_by:
          type: string
          enum: [none, room, staff, course, module]
          default: room
        min_overlap_minutes: { type: integer, minimum: 1, default: 1 }
        include_touching: { type: boolean, default: false }

    ConflictDetectionResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConflictGroup'

    # -- Changes -----------------------------------------------------------
    ChangeItem:
      type: object
      required: [resource_type, resource_id, action, changed_at]
      properties:
        resource_type:
          type: string
          enum: [module, course, event]
        resource_id: { type: string }
        action:
          type: string
          enum: [created, updated, deleted]
        changed_at:
          type: string
          format: date-time
        item:
          oneOf:
            - $ref: '#/components/schemas/ModuleSummary'
            - $ref: '#/components/schemas/CourseSummary'
            - $ref: '#/components/schemas/EventSummary'

    ChangesResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeItem'

    # -- Ingestion ---------------------------------------------------------
    IngestionRun:
      type: object
      required: [id, status, started_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        trigger:
          type: string
          enum: [manual, scheduled, webhook]
        semesters:
          type: array
          items: { type: string }
        faculties:
          type: array
          items: { type: string }
        stats:
          type: object
          additionalProperties: { type: integer }

    IngestionRunCreateRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [full, incremental]
          default: incremental
        semester_ids:
          type: array
          items: { type: string }
        faculty_ids:
          type: array
          items: { type: string }
        changed_since:
          type: string
          format: date-time
        max_pages: { type: integer, minimum: 1 }

    IngestionRunListResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionRun'

    IngestionRunLogEntry:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warning, error]
        message: { type: string }
        context:
          type: object
          additionalProperties: true

    IngestionRunLogsResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/Pagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionRunLogEntry'

    # -- Export request ----------------------------------------------------
    IcalExportRequest:
      type: object
      required: [filter]
      properties:
        filter:
          $ref: '#/components/schemas/EventFilter'
        timezone:
          type: string
          default: Europe/Berlin
        calendar_name:
          type: string
          default: AlmaWeb Schedule

    # -- Legacy compatibility schemas --------------------------------------
    LegacyModuleResponse:
      type: object
      required: [id, name, module_number, credits]
      properties:
        id: { type: integer, nullable: true }
        name: { type: string }
        module_number: { type: string }
        credits: { type: integer }
        planung: { type: string }
        language: { type: string }
        degree_ids:
          type: object
          additionalProperties:
            type: array
            items: { type: integer }
        event_ids:
          type: array
          items: { type: integer }

    LegacyEventResponse:
      type: object
      required: [id, type, title, weekday, start_time, end_time]
      properties:
        id: { type: integer, nullable: true }
        type: { type: string }
        title: { type: string }
        weekday: { type: integer }
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        location_id: { type: integer }
        status: { type: string }
        module_ids:
          type: array
          items: { type: integer }
        staff_ids:
          type: array
          items: { type: integer }
